# Development environment only. The database is not published to the host network,
# so the fixed dev password below grants no access from outside the dev containers.
# Never reuse it anywhere else – production credentials live in the (git-ignored) .env.
#
# `app` is the VS Code / Claude Code workspace. `web` and `worker` run the app itself
# from the bind-mounted source and restart on every code change.
x-dev-runtime: &dev-runtime
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: dev
  image: flighttracker:dev
  working_dir: /app
  volumes:
    - ..:/app
  environment:
    DATABASE_URL: postgresql+psycopg://flighttracker:dev-only-password@db:5432/flighttracker
    SESSION_COOKIE_SECURE: "false"
    # Bind mounts from Windows/WSL often deliver no file events – poll for changes instead.
    WATCHFILES_FORCE_POLLING: "true"
  restart: unless-stopped
  # Only "started", not "completed": a failing migration must never block the whole dev
  # container from starting. Until it is done, requests fail and the worker retries each tick.
  depends_on:
    migrate:
      condition: service_started

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/plane-and-simple:cached
      - claude-config:/home/vscode/.claude
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://flighttracker:dev-only-password@db:5432/flighttracker
      TEST_DATABASE_URL: postgresql+psycopg://flighttracker:dev-only-password@db:5432/flighttracker_test
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flighttracker
      POSTGRES_PASSWORD: dev-only-password
      POSTGRES_DB: flighttracker
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ../docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flighttracker -d flighttracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *dev-runtime
    restart: "no"
    # Only for WIKIDATA_CONTACT; optional because .env may not exist on the very first start.
    env_file:
      - path: ../.env
        required: false
    command:
      - sh
      - -c
      - alembic upgrade head && python -m flighttracker.cli import-airports --if-needed
    depends_on:
      db:
        condition: service_healthy

  # web/worker read secrets and settings from /app/.env themselves (generated by the
  # postCreateCommand `cli init-dev-env`). `watchfiles` restarts them whenever the code or
  # .env changes – no rebuild needed. Templates and CSS are served fresh on every request.
  # Not published on the host: VS Code forwards web:8000 (devcontainer.json "forwardPorts"),
  # which works no matter where Docker runs (Docker Desktop, WSL, remote host).
  web:
    <<: *dev-runtime
    command:
      - sh
      - -c
      - >-
        until [ -f .env ]; do echo "Waiting for .env (python -m flighttracker.cli init-dev-env) ..."; sleep 3; done;
        exec watchfiles "uvicorn flighttracker.web.app:create_app --factory --host 0.0.0.0 --port 8000"
        flighttracker .env

  worker:
    <<: *dev-runtime
    command:
      - sh
      - -c
      - >-
        until [ -f .env ]; do echo "Waiting for .env (python -m flighttracker.cli init-dev-env) ..."; sleep 3; done;
        exec watchfiles "python -m flighttracker.worker" flighttracker .env

volumes:
  pgdata-dev:
  # Keeps the Claude Code login and settings across container rebuilds.
  claude-config:
